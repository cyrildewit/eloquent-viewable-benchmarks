name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests, results, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate every result against the schema and its dump
        run: pnpm validate
      - run: pnpm lint
      - name: Lint the shell script
        run: shellcheck scripts/run.sh
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Build the site
        run: pnpm build

      # The real results may not exercise every page yet; the sample data does.
      - name: Build the site on sample data
        run: pnpm sample && pnpm build
        env:
          RESULTS_DIR: ./.cache/sample/results
